name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://agit:agit@127.0.0.1:5432/agit
      APP_URL: https://agit.volochek69.ru
      VK_GROUP_ID: "240908156"
      VK_GROUP_TOKEN: ci-placeholder
      VK_CALLBACK_SECRET: ci-placeholder
      VK_CONFIRMATION_TOKEN: ci-placeholder
      ADMIN_PASSWORD: ci-placeholder
      SESSION_SECRET: ci-placeholder-ci-placeholder-ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run build
